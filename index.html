<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="活動簽到與線上直播系統">
  <title>活動簽到系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="badge">活動入口</div>

      <h1 id="event-name">活動簽到系統</h1>
      <p class="subtitle">歡迎參加活動。系統將依活動時間顯示目前狀態，活動開始後即可輸入工號完成簽到。</p>

      <section id="status-panel" class="status-panel" aria-live="polite">
        <div id="status-icon" class="status-icon">⏳</div>
        <h2 id="status-title" class="status-title">活動尚未開始</h2>
        <p id="status-text" class="status-text">正在取得活動資訊...</p>

        <div id="countdown" class="countdown hidden">
          <div class="time-box"><span id="days" class="time-number">00</span><span class="time-label">天</span></div>
          <div class="time-box"><span id="hours" class="time-number">00</span><span class="time-label">時</span></div>
          <div class="time-box"><span id="minutes" class="time-number">00</span><span class="time-label">分</span></div>
          <div class="time-box"><span id="seconds" class="time-number">00</span><span class="time-label">秒</span></div>
        </div>
      </section>

      <section id="signin-section" class="form hidden">
        <form id="signin-form">
          <label for="emp-id">員工工號</label>
          <input id="emp-id" type="text" placeholder="請輸入您的工號" autocomplete="off" required>
          <button id="submit-btn" type="submit">簽到並進入直播</button>
          <div id="message" class="message" role="status"></div>
        </form>
      </section>

      <section id="live-section" class="status-panel hidden">
        <div class="status-icon">●</div>
        <h2 class="status-title">直播已開啟</h2>
        <p class="status-text">您已完成簽到，以下為活動直播畫面。</p>
        <div id="player" class="video-wrapper"></div>
      </section>

      <footer class="footer">V1 開發版本</footer>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/event.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
